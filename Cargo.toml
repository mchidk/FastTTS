[package]
name = "fasttts"
version = "1.0.2"
edition = "2021"
rust-version = "1.88"
description = "Hold Caps Lock, speak English, let go: fast local dictation for Windows"
license = "MIT"
repository = "https://github.com/mchidk/FastTTS"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
anyhow = "1"
cactus-rs = "0.2"
clipboard-win = "5.4.3"
cpal = "0.18.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
png = "0.18"
