[package]
name = "fasttts"
version = "0.2.2"
edition = "2021"
description = "Fast native English dictation for Windows: hold Caps Lock to speak"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
anyhow = "1"
clipboard-win = "5.4.3"
cpal = "0.18.2"
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
parking_lot = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std"] }
tracing-appender = "0.2"
whisper-rs = { version = "0.15.1", default-features = false }

# Local patch: pre-generated bindings have MSVC CRT layout assertions; the
# three MinGW CRT sizes differ, so whisper-rs-sys is vendored with fixed ones.
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

[dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]
