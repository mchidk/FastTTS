[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fasttts"
version = "0.1.0"
description = "Fast local English dictation for Windows: hold Caps Lock, speak, and the text is typed"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Christensen" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "sounddevice>=0.5",
  "faster-whisper>=1.1",
  "av>=14,<19",
  "pystray>=0.19",
  "pillow>=10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.15",
]

[project.gui-scripts]
fasttts = "fasttts.app:main"

[project.urls]
Homepage = "https://github.com/michaelchristensen/FastTTS"

[tool.hatch.build.targets.wheel]
packages = ["src/fasttts"]

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "fasttts/NOTICE"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
